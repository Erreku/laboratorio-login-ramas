<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login de demostración</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Primera versión del login que se mejorará con tres ramas. -->
  <main class="login-card">
    <h1>Login</h1>
    <form id="loginForm" novalidate>
      <input id="email" name="email" type="email" placeholder="Correo" aria-label="Correo electrónico" autocomplete="username">
      <div class="password-row">
        <input id="password" name="password" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password">
        <button id="togglePassword" type="button">Mostrar</button>
      </div>
      <button class="submit-button" type="submit">Entrar</button>
      <p id="formMessage" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
